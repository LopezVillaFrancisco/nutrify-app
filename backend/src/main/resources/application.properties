spring.application.name=nutrify-backend
# Las variables se leen del entorno o de backend/.env (copiá .env.example)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.shutdown=graceful
spring.threads.virtual.enabled=true

# Postgres de Supabase (Connect → Session pooler). prepareThreshold=0 hace falta si usás el Transaction pooler (6543).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.ApplicationName=nutrify-backend

logging.level.root=INFO
